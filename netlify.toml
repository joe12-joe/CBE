# Netlify config — deploys the frontend (apps/web) as a static SPA.
# Backend stays on Supabase; the app talks to it via VITE_SUPABASE_* env vars.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router SPA fallback: any unknown path serves index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Vite emits hashed, immutable assets under /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"